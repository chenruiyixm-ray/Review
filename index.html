<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文言实词配对大挑战 · 300词通关</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="bg-particles"></div>

<div class="container" id="app">
  <!-- Dynamic content rendered here -->
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">🎉</div>
    <h2 id="modalTitle">关卡完成！</h2>
    <div class="modal-stars" id="modalStars">⭐⭐⭐</div>
    <p id="modalDesc">太棒了！你已成功配对所有词语！</p>
    <div>
      <button class="modal-btn" id="modalBtn1">下一关</button>
      <button class="modal-btn secondary" id="modalBtn2">返回选关</button>
    </div>
  </div>
</div>

<!-- Scripts (order matters) -->
<script src="js/game-data.js"></script>
<script src="js/user-manager.js"></script>
<script src="js/game-engine.js"></script>
<script>
  // ====== Bootstrap ======
  // Expose UI actions globally so onclick handlers in rendered HTML can reach them.
  const GameUI = GameEngine;
  document.addEventListener('DOMContentLoaded', () => {
    GameEngine.init();
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文言实词配对大挑战 · 300词通关</title>

  <!-- ===== Favicon：SVG 内联（古书卷轴 + 毛笔字风格） ===== -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%236c5ce7'/%3E%3Cstop offset='100%25' style='stop-color:%23a29bfe'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect rx='10' ry='10' x='4' y='8' width='56' height='48' fill='%231a1925' stroke='%236c5ce7' stroke-width='2'/%3E%3Cpath d='M16 18 L48 18 M16 28 L42 28 M16 38 L38 38' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='50' cy='42' r='4' fill='%23fdcb6e'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="bg-particles"></div>

<!-- ===== 登录页 ===== -->
<div class="container" id="loginScreen">
  <div class="login-card">
    <div class="brand-icon">
      <svg viewBox="0 0 80 80" width="88" height="88" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6c5ce7"/>
            <stop offset="100%" style="stop-color:#a29bfe"/>
          </linearGradient>
          <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#fdcb6e"/>
            <stop offset="100%" style="stop-color:#e17055"/>
          </linearGradient>
        </defs>
        <!-- 卷轴背景 -->
        <rect rx="12" ry="12" x="6" y="10" width="68" height="60" fill="#1a1925" stroke="url(#bg)" stroke-width="2.5"/>
        <!-- 装饰线条：模拟竹简/古文 -->
        <line x1="20" y1="22" x2="60" y2="22" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"/>
        <line x1="20" y1="34" x2="54" y2="34" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"/>
        <line x1="20" y1="46" x2="50" y2="46" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"/>
        <!-- 毛笔点 -->
        <circle cx="62" cy="50" r="5" fill="url(#ink)"/>
        <!-- 左上角装饰 -->
        <path d="M10 10 Q18 14 14 22" stroke="url(#ink)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>文言实词配对大挑战</h1>
    <p>300个高中必背文言实词 · 65关逐层突破</p>
    <div class="input-group">
      <input type="text" id="usernameInput" placeholder="请输入用户名" autocomplete="off" maxlength="20">
      <button id="loginBtn">登 录</button>
    </div>
    <div class="error-msg" id="loginError"></div>
    <div class="quick-users" id="quickUsers"></div>
    <div class="login-tip">无需密码 · 输入即可开始 · 进度自动保存</div>
  </div>
</div>

<!-- ===== 主应用区 ===== -->
<div class="container hidden" id="app"></div>

<!-- ===== 隐藏的文件输入（导入 userdata 用） ===== -->
<input type="file" id="importFile" accept=".*" style="display:none">

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">🎉</div>
    <h2 id="modalTitle">关卡完成！</h2>
    <div class="modal-stars" id="modalStars">⭐⭐⭐</div>
    <p id="modalDesc">太棒了！你已成功配对所有词语！</p>
    <div>
      <button class="modal-btn" id="modalBtn1">下一关</button>
      <button class="modal-btn secondary" id="modalBtn2">返回选关</button>
    </div>
  </div>
</div>

<!-- ===== JS 模块 ===== -->
<script src="js/game-data.js"></script>
<script src="js/user-manager.js"></script>
<script src="js/game-engine.js"></script>

</body>
</html>
